server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name clwenhaj.42.fr;

    # --- SSL Settings ---
    ssl_certificate /etc/nginx/ssl/clwenhaj.42.fr.crt;
    ssl_certificate_key /etc/nginx/ssl/clwenhaj.42.fr.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- WordPress Files Location ---
    root /var/www/html;
    index index.php index.html;

    # --- URL Forwarding Rules ---
    location / {
        # permalinks
        try_files $uri $uri/ /index.php?$args;
    }

    # --- Adminer Proxy ---
    location /adminer {
        proxy_pass http://adminer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy vers le conteneur du site statique
    location /site {
        proxy_pass http://website:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Bonus cAdvisor ---
    location /cadvisor {
        proxy_pass http://cadvisor:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

# Pour attraper le premier accès sans slash et l'envoyer proprement
    location = /cadvisor {
        return 301 https://$host/cadvisor/;
    }

    # --- PHP Requests Forwarding ---
    location ~ \.php$ {
        include fastcgi_params;
        
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # deny secret files (.git, .)
    location ~ /\. {
        deny all;
    }
}
