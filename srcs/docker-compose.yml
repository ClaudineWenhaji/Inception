services:

  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    restart: always
    depends_on:
      - wordpress
    ports:
      - "443:443"
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-network

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    restart: always
    depends_on:
      - mariadb
    secrets:
      - wp_admin_password
      - wp_user_password
      - db_user_password
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-network

  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    restart: always
    secrets:
      - db_root_password
      - db_user_password
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception-network

    #### ------------BONUS SERVICES -------------- ######

  adminer:
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    restart: always
    depends_on:
      - mariadb
    networks:
      - inception-network
    ports:
      - "8080:8080"

  redis:
    build:
      context: ./requirements/bonus/redis
    image: redis
    container_name: redis
    restart: always
    networks:
      - inception-network
    expose:
      - "6379"
 
  ftp:
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    restart: always
    secrets:
      - ftp_user_password
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception-network
    ports:
      - "21:21"
      - "40000-40005:40000-40005"  

  website:
    build:
      context: ./requirements/bonus/website
    image: website
    container_name: website
    restart: always
    networks:
      - inception-network
    expose:
      - "80"

  cadvisor:
    image: ghcr.io/google/cadvisor:0.54.0
    container_name: cadvisor
    restart: always
    ports:
      - "8081:8080"
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /home/clwenhaj/data/:/home/clwenhaj/data:ro
      - /dev/disk:/dev/disk:ro  
    command:
      - '--docker_only=true'
      - '--disable_metrics=disk'
    networks:
      - inception-network
        
    #### ------------BONUS SERVICES -------------- ######

volumes:

  mariadb_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${HOME}/data/mariadb'

  wordpress_data:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: '${HOME}/data/wordpress'

networks:
  inception-network:
    driver: bridge

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt

  db_user_password:
    file: ../secrets/db_user_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

  ftp_user_password:
    file: ../secrets/ftp_user_password.txt
